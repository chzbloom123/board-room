<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board Room</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Login view -->
    <section id="view-login" class="view" hidden>
      <div class="login-card">
        <h1 class="brand">Board Room</h1>
        <p class="tagline">Instructor sign-in</p>
        <form id="login-form">
          <label>Profile name
            <input name="name" autocomplete="username" required>
          </label>
          <label>Password
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn btn-gold">Sign in</button>
          <p id="login-error" class="form-error" role="alert" hidden></p>
        </form>
      </div>
    </section>

    <!-- Library view -->
    <section id="view-library" class="view" hidden>
      <header class="topbar">
        <span class="brand brand-small">Board Room</span>
        <span class="spacer"></span>
        <span id="profile-name" class="profile-chip"></span>
        <button id="logout-btn" class="btn btn-quiet">Sign out</button>
      </header>
      <main class="library">
        <div class="library-head">
          <h2>Boards</h2>
          <span class="spacer"></span>
          <button id="import-btn" class="btn btn-quiet">Import JSON</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
          <button id="new-board-btn" class="btn btn-gold btn-inline">New board</button>
        </div>
        <ul id="board-list" class="board-list"></ul>
        <p id="library-empty" class="empty-note" hidden>
          No boards yet — create one from CSV or import a JSON export.
        </p>
      </main>
    </section>

    <!-- Editor view (create + edit) -->
    <section id="view-editor" class="view" hidden>
      <header class="topbar">
        <span class="brand brand-small">Board Room</span>
        <span class="spacer"></span>
        <button id="editor-back-btn" class="btn btn-quiet">Back to library</button>
      </header>
      <main class="editor">
        <h2 id="editor-title">New board</h2>
        <label class="editor-name">Board name
          <input id="editor-name" placeholder="e.g. Q3 Safety Review" required>
        </label>
        <div class="editor-csv-head">
          <label for="editor-csv">Questions (CSV: topic, points, question, answer — one row per question)</label>
          <span class="spacer"></span>
          <button id="csv-upload-btn" class="btn btn-quiet btn-small">Upload CSV file</button>
          <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
        </div>
        <textarea id="editor-csv" rows="12" spellcheck="false"
          placeholder="Safety Basics,100,What does PPE stand for?,Personal Protective Equipment"></textarea>
        <div id="editor-problems"></div>
        <div id="editor-preview"></div>
        <div class="editor-actions">
          <button id="editor-save-btn" class="btn btn-gold btn-inline" disabled>Save board</button>
          <span id="editor-status" class="editor-status"></span>
        </div>
      </main>
    </section>
    <!-- Player setup view -->
    <section id="view-setup" class="view" hidden>
      <header class="topbar">
        <span class="brand brand-small">Board Room</span>
        <span class="spacer"></span>
        <button id="setup-back-btn" class="btn btn-quiet">Back to library</button>
      </header>
      <main class="setup">
        <h2 id="setup-title">New game</h2>
        <p class="setup-hint">Add the players or teams answering today.</p>
        <ul id="player-list" class="player-list"></ul>
        <div class="setup-actions">
          <button id="add-player-btn" class="btn btn-quiet">Add player</button>
          <button id="start-game-btn" class="btn btn-gold btn-inline">Start game</button>
        </div>
        <p id="setup-error" class="form-error" role="alert" hidden></p>
      </main>
    </section>

    <!-- Live game view -->
    <section id="view-game" class="view" hidden>
      <header class="topbar game-topbar">
        <span class="brand brand-small">Board Room</span>
        <span id="game-board-name" class="game-board-name"></span>
        <span class="spacer"></span>
        <button id="undo-btn" class="btn btn-quiet" disabled>Undo</button>
        <button id="end-game-btn" class="btn btn-danger">End game</button>
        <button id="game-back-btn" class="btn btn-quiet" title="The game stays active — resume it from the library">Library</button>
      </header>
      <main class="game">
        <div id="game-board" class="game-board"></div>
      </main>
      <footer id="scoreboard" class="scoreboard"></footer>

      <!-- Question modal -->
      <div id="question-modal" class="modal" hidden>
        <div class="modal-card">
          <div id="modal-head" class="modal-head"></div>
          <div id="modal-question" class="modal-question"></div>
          <div id="modal-answer" class="modal-answer" hidden></div>
          <div class="modal-controls">
            <button id="reveal-btn" class="btn btn-gold btn-inline">Reveal answer</button>
          </div>
          <div id="judging" class="judging" hidden></div>
          <div class="modal-footer">
            <button id="noone-btn" class="btn btn-quiet" hidden>No one got it — close question</button>
            <button id="modal-cancel-btn" class="btn btn-quiet">Back to board</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
