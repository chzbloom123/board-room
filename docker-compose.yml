services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boardroom
      POSTGRES_PASSWORD: boardroom
      POSTGRES_DB: boardroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardroom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
